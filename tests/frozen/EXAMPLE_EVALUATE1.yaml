theory:
  camb:
    path: ./external_modules/code/CAMB
    stop_at_error: False
    use_renames: True
    extra_args:
      halofit_version: takahashi
      # k_per_logint 50: the tests/ accuracy scan shows the default 10 carries
      # ~0.26 of chi2 error in 3x2pt, converged by 25-50, and the knob is cheap.
      # CAMB AccuracyBoost stays at its old value: its apparent ~0.8 sensitivity
      # cannot be attributed while the cosmolike accuracyboost integration
      # jitters (under investigation), and raising it is expensive; revisit
      # after the jitter is fixed.
      AccuracyBoost: 1.05
      dark_energy_model: ppf
      accurate_massive_neutrino_transfers: false
      k_per_logint: 50
      kmax: 10
  # bfmt:
  #   baryon_model: 2 # 1 = SP(k), 2 = BCEmu, 3 = FlamingoEmulator, 4 = BACCOemu, 5 = BCemu2025
  #   nz: 20  # internal (z, k) computation grid; the result is 2D-splined
  #   nk: 100 # onto the grid the likelihood requests
  #   above_zmax: unity # S(k,z) above the model range: unity (default) or constant
  #   q2_bcemu25: 0.70 # BCemu2025 only: q2 coordinate (native grid: 0.5, 0.7, 1.0)

