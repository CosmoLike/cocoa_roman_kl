timing: True
debug: False
stop_at_error: False

likelihood:
  roman_kl.cosmic_shear:
    path: ./external_modules/data/roman_kl
    data_file: roman_kl_mcmc.dataset
    print_datavector: True
    print_datavector_file: "./projects/roman_kl/chains/roman_kl_cosmic_shear.modelvector"
    accuracyboost: 1.0
    integration_accuracy: 0
    kmax_boltzmann: 7.5
    ggl_exclude: []
    # 1 EE2, 2 Halofit
    non_linear_emul: 2
    IA_model: 0 # NLA (0) or TATT (1)
    IA_code: 0  # CFASTPT (0) or FASTPT (1) (only works if not NLA)
    IA_redshift_evolution: 3
    debug: False
    use_baryon_pca: false
    create_baryon_pca: false
    filename_baryon_pca: "./projects/roman_kl/chains/pca.txt"
    external_baryon_suppression: False
params:
  As_1e9:
    prior:
      min: 0.5
      max: 5
    ref:
      dist: norm
      loc: 2.1
      scale: 0.65
    proposal: 0.4
    latex: 10^9 A_\mathrm{s})
    drop: true
    renames: A
  ns:
    prior:
      min: 0.5
      max: 1.1
    ref:
      dist: norm
      loc: 0.9645
      scale: 0.01
    proposal: 0.01
    latex: n_\mathrm{s}
  H0:
    prior:
      min: 40
      max: 90
    ref:
      dist: norm
      loc: 67.27
      scale: 5
    proposal: 3
    latex: H_0
  omegab:
    prior:
      min: 0.005
      max: 0.095
    ref:
      dist: norm
      loc: 0.0491685
      scale: 0.004
    proposal: 0.004
    latex: \Omega_\mathrm{b}
    drop: true
  omegam:
    prior:
      min: 0.095
      max: 0.585
    ref:
      dist: norm
      loc: 0.3156
      scale: 0.015
    proposal: 0.015
    latex: \Omega_\mathrm{m}
    drop: true
  mnu:
    prior:
      min: 0.0
      max: 0.6
    ref:
      dist: norm
      loc: 0.25
      scale: 0.1
    proposal: 0.06
  w0pwa:
    prior:
      min: -5 
      max: -0.01
    ref:
      dist: norm
      loc: -0.99
      scale: 0.05
    proposal: 0.05
    latex: w_{0,\mathrm{DE}}+w_{a,\mathrm{DE}}
    drop: true
  w:
    prior:
      min: -3
      max: -0.01
    ref:
      dist: norm
      loc: -0.99
      scale: 0.05
    proposal: 0.05
    latex: w_{0,\mathrm{DE}}
  tau:
    value: 0.0697186
    latex: \tau_\mathrm{reio}
  # ---------------------------------------------------------------------------------------
  # ------------------------------------- DERIVED PARAMETERS ------------------------------
  # ---------------------------------------------------------------------------------------
  # WARNING: DO NOT REMOVE omegabh2/omegach2/omegamh2/wa/As/ FROM DERIVED PARAMETERS
  # SEE: github.com/CosmoLike/cocoa#warning-warning-warning-weak-lensing-yaml-files-in-cobaya-
  # --------------------------------------------------------------------------------------- 
  As:
    value: 'lambda As_1e9: 1e-9 * As_1e9'
    latex: A_\mathrm{s}
  wa:
    value: 'lambda w0pwa, w: w0pwa - w'
    latex: w_{a,\mathrm{DE}}
  omegabh2:
    value: 'lambda omegab, H0: omegab*(H0/100)**2'
    latex: \Omega_\mathrm{b} h^2
  omegach2:
    value: 'lambda omegam, omegab, mnu, H0: (omegam-omegab)*(H0/100)**2-(mnu*(3.046/3)**0.75)/94.0708'
    latex: \Omega_\mathrm{c} h^2
  omegal:
    latex: \Omega_\Lambda
  omegamh2:
    derived: 'lambda omegam, H0: omegam*(H0/100)**2'
    latex: \Omega_\mathrm{m} h^2
  sigma8:
    latex: \sigma_8
  s8h5:
    derived: 'lambda sigma8, H0: sigma8*(H0*1e-2)**(-0.5)'
    latex: \sigma_8/h^{0.5}
  s8omegamp5:
    derived: 'lambda sigma8, omegam: sigma8*omegam**0.5'
    latex: \sigma_8 \Omega_\mathrm{m}^{0.5}
  s8omegamp25:
    derived: 'lambda sigma8, omegam: sigma8*omegam**0.25'
    latex: \sigma_8 \Omega_\mathrm{m}^{0.25}
  age:
    latex: '{\rm{Age}}/\mathrm{Gyr}'
  rdrag:
    latex: r_\mathrm{drag}
  yheused:
    latex: Y_P^\mathrm{BBN}
  omegan2:
    latex: \Omega_\mathrm{\\nu} h^2
  omegan:
    derived: 'lambda omegan2, H0: omegan2/((H0/100)**2)'
    latex: \Omega_\mathrm{\\nu}
  # ------------------------------------------------------------------------
  # ------------------------------------------------------------------------
  # Nuisance parameters below (it overwrites the default settings)
  # Default settings in likelihood/roman_kl_params_lens.yaml
  # Default settings in likelihood/roman_kl_params_source.yaml
  # ------------------------------------------------------------------------
  # ------------------------------------------------------------------------
  ROMAN_KL_A1_1:
    value: 0.0
    latex: A_\mathrm{1-IA,ROMAN_KL}^1
  ROMAN_KL_A1_2:
    value: 0.0
    latex: A_\mathrm{1-IA,ROMAN_KL}^2
  ROMAN_KL_A2_1:
    value: 0.0
    latex: A_\mathrm{2-IA,Roman}^1
  ROMAN_KL_A2_2:
    value: 0.0
    latex: A_\mathrm{2-IA,Roman}^2
