      ns: 0.9645
      H0: 67.27
      omegab: 0.0491685
      omegam: 0.3156
      mnu: 0.06
      w0pwa: -1.0
      w: -1.0
      ROMAN_KL_DZ_S1: 0.0
      ROMAN_KL_DZ_S2: 0.0
      ROMAN_KL_DZ_S3: 0.0
      ROMAN_KL_DZ_S4: 0.0
      ROMAN_KL_DZ_S5: 0.0
      ROMAN_KL_DZ_S6: 0.0
      ROMAN_KL_DZ_S7: 0.0
      ROMAN_KL_DZ_S8: 0.0
      ROMAN_KL_DZ_S9: 0.0
      ROMAN_KL_DZ_S10: 0.0
      ROMAN_KL_M1: 0.0
      ROMAN_KL_M2: 0.0
      ROMAN_KL_M3: 0.0
      ROMAN_KL_M4: 0.0
      ROMAN_KL_M5: 0.0
      ROMAN_KL_M6: 0.0
      ROMAN_KL_M7: 0.0
      ROMAN_KL_M8: 0.0
      ROMAN_KL_M9: 0.0
      ROMAN_KL_M10: 0.0
      ROMAN_KL_B1_1: 1.24
      ROMAN_KL_B1_2: 1.36
      ROMAN_KL_B1_3: 1.48
      ROMAN_KL_B1_4: 1.60
      ROMAN_KL_B1_5: 1.72
      ROMAN_KL_B1_6: 1.84
      ROMAN_KL_B1_7: 1.96
      ROMAN_KL_B1_8: 2.08
      ROMAN_KL_B1_9: 2.20
      ROMAN_KL_B1_10: 2.32
